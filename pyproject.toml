[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dube"
version = "2.0.0"
description = "duBE — du But Easier: enhanced disk usage analyser with tree view, sort, filters and clean output"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sergio Berruetta" }]
requires-python = ">=3.8"
dependencies = ["shellcolorize"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage     = "https://github.com/serber-info/duBE"
"Bug Tracker" = "https://github.com/serber-info/duBE/issues"
"Source Code" = "https://github.com/serber-info/duBE"

[project.scripts]
dube = "duBE:main"

[tool.setuptools]
py-modules = ["duBE"]
